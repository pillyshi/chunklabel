[project]
name = "chunklabel"
version = "0.2.1"
description = "Split text into semantically coherent, LLM-categorized chunks"
authors = [{ name = "pillyshi", email = "h.tanaka36@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "rapidfuzz>=3.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
llamacpp = ["llama-cpp-python>=0.3"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.0",
    "ruff>=0.4",
    "twine>=6.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["research/", ".claude/"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
