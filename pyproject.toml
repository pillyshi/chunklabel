[tool.poetry]
name = "chunklabel"
version = "0.1.8"
description = "Split text into semantically coherent, LLM-categorized chunks"
authors = ["pillyshi <h.tanaka36@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "chunklabel" }]

[tool.poetry.dependencies]
python = "^3.10"
langchain = "^0.3"
langchain-openai = "^0.3"
rapidfuzz = "^3.0"
pydantic = "^2.0"

[tool.poetry.extras]
ollama = ["langchain-ollama"]

[tool.poetry.dependencies.langchain-ollama]
version = "^0.3"
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
mypy = "^1.0"
ruff = "^0.4"
twine = "^6.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
